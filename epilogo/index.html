<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Epílogo — Donde florece la soledad</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background:
        radial-gradient(
          circle at top,
          #101827 0%,
          #070b12 38%,
          #020407 75%,
          #000000 100%
        );
      color: #f4f1ec;
      font-family: Georgia, "Times New Roman", serif;
      min-height: 100vh;
    }

    /* PORTADA DE LA SECCIÓN */

    .intro {
      min-height: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px 50px;
    }

    .obra {
      color: #d76c78;
      font-size: 11px;
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    h1 {
      font-size: clamp(48px, 7vw, 82px);
      font-weight: normal;
      letter-spacing: 9px;
      line-height: 1;
      margin-bottom: 26px;
    }

    .subtitulo {
      color: #777b85;
      font-size: 14px;
      font-style: italic;
      letter-spacing: 2px;
    }

    /* CONTROL DE AUDIO */

    .control-audio {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 100;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(3,5,8,0.72);
      color: #d9d4cf;
      font-size: 16px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: 0.3s;
    }

    .control-audio:hover {
      color: white;
      border-color: #d76c78;
      background: rgba(215,108,120,0.10);
    }

    /* LECTOR */

    .lector {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #010305;
      padding-bottom: 40px;
    }

    .pagina {
      display: block;
      width: min(100%, 900px);
      height: auto;
      margin: 0 auto;
    }

    /* FINAL */

    .final {
      min-height: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 20px 100px;
    }

    .fin {
      color: #d76c78;
      font-size: 11px;
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .final h2 {
      font-size: clamp(32px, 5vw, 48px);
      font-weight: normal;
      letter-spacing: 2px;
      margin-bottom: 42px;
    }

    .navegacion {
      display: flex;
      gap: 18px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .boton {
      display: inline-block;
      color: #d9d4cf;
      text-decoration: none;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 2px;
      padding: 16px 22px;
      border: 1px solid #30343b;
      transition: all 0.3s ease;
    }

    .boton:hover {
      color: white;
      border-color: #d76c78;
      background: rgba(215, 108, 120, 0.07);
    }

    .boton.siguiente {
      color: #e88791;
      border-color: #67363d;
    }

    .boton.siguiente:hover {
      color: white;
      border-color: #d76c78;
      background: rgba(215, 108, 120, 0.12);
    }

    @media (max-width: 600px) {
      .intro {
        min-height: 300px;
        padding: 50px 20px 40px;
      }

      h1 {
        letter-spacing: 5px;
      }

      .obra {
        letter-spacing: 4px;
      }

      .pagina {
        width: 100%;
      }

      .final {
        min-height: 350px;
      }

      .navegacion {
        flex-direction: column;
        align-items: center;
      }

      .boton {
        width: 100%;
        max-width: 330px;
      }

      .control-audio {
        top: 14px;
        right: 14px;
        width: 38px;
        height: 38px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <!-- AUDIO DEL EPÍLOGO -->

  <audio
    id="audio-epilogo"
    src="../Audios/La%20soledad%20-%20Voice%20theme.mp3"
    loop
    preload="auto">
  </audio>

  <button
    id="control-audio"
    class="control-audio"
    onclick="alternarSonido()"
    aria-label="Activar o silenciar sonido"
    title="Activar o silenciar sonido">
    🔊
  </button>


  <header class="intro">

    <div class="obra">
      DONDE FLORECE LA SOLEDAD
    </div>

    <h1>
      EPÍLOGO
    </h1>

    <div class="subtitulo">
      Desliza para continuar
    </div>

  </header>


  <main class="lector">

    <img
      class="pagina"
      src="0.Portada%20ep%C3%ADlogo.jpg"
      alt="Portada del Epílogo"
    >

    <img class="pagina" src="1..jpg" alt="Página 1" loading="lazy">
    <img class="pagina" src="2..jpg" alt="Página 2" loading="lazy">
    <img class="pagina" src="3..jpg" alt="Página 3" loading="lazy">
    <img class="pagina" src="4..jpg" alt="Página 4" loading="lazy">
    <img class="pagina" src="5..jpg" alt="Página 5" loading="lazy">
    <img class="pagina" src="6..jpg" alt="Página 6" loading="lazy">
    <img class="pagina" src="7..jpg" alt="Página 7" loading="lazy">
    <img class="pagina" src="8..jpg" alt="Página 8" loading="lazy">
    <img class="pagina" src="9..jpg" alt="Página 9" loading="lazy">

  </main>


  <footer class="final">

    <div class="fin">
      FIN
    </div>

    <h2>
      Donde florece la soledad.
    </h2>

    <div class="navegacion">

      <a class="boton enlace-salida" href="../capitulo-3/">
        ← Volver al Capítulo 3
      </a>

      <a class="boton enlace-salida" href="../">
        Volver al menú
      </a>

      <a
        class="boton siguiente enlace-salida"
        href="../detras/"
      >
        Descubrir lo que hay detrás →
      </a>

    </div>

  </footer>


  <script>

    const audioEpilogo =
      document.getElementById("audio-epilogo");

    const controlAudio =
      document.getElementById("control-audio");

    const volumenEpilogo = 0.22;

    let silenciado =
      localStorage.getItem("sonidoSilenciado") === "true";

    audioEpilogo.muted = silenciado;
    audioEpilogo.volume = 0;

    actualizarIconoSonido();


    /* ---------- FADE IN ---------- */

    function fadeIn(audio, volumenFinal, duracion = 1800) {

      clearInterval(audio.fadeInterval);

      const pasos = 40;
      const intervalo = duracion / pasos;

      const volumenInicial = audio.volume;

      const incremento =
        (volumenFinal - volumenInicial) / pasos;

      const reproduccion = audio.play();

      if (reproduccion !== undefined) {

        reproduccion.catch(() => {
          /*
            Si el navegador bloquea autoplay,
            se intentará de nuevo con la primera interacción.
          */
        });
      }

      audio.fadeInterval = setInterval(() => {

        if (audio.paused) {
          clearInterval(audio.fadeInterval);
          return;
        }

        const nuevoVolumen =
          Math.min(
            audio.volume + incremento,
            volumenFinal
          );

        audio.volume = nuevoVolumen;

        if (nuevoVolumen >= volumenFinal) {

          audio.volume = volumenFinal;

          clearInterval(audio.fadeInterval);
        }

      }, intervalo);
    }


    /* ---------- FADE OUT ---------- */

    function fadeOut(audio, duracion = 700) {

      clearInterval(audio.fadeInterval);

      if (audio.paused) return;

      const volumenInicial = audio.volume;

      const pasos = 30;
      const intervalo = duracion / pasos;

      const decremento =
        volumenInicial / pasos;

      audio.fadeInterval = setInterval(() => {

        const nuevoVolumen =
          Math.max(
            audio.volume - decremento,
            0
          );

        audio.volume = nuevoVolumen;

        if (nuevoVolumen <= 0) {

          audio.volume = 0;

          clearInterval(audio.fadeInterval);

          audio.pause();
        }

      }, intervalo);
    }


    /* ---------- CONTROL DE SONIDO ---------- */

    function alternarSonido() {

      silenciado = !silenciado;

      audioEpilogo.muted = silenciado;

      localStorage.setItem(
        "sonidoSilenciado",
        silenciado
      );

      actualizarIconoSonido();

      if (!silenciado && audioEpilogo.paused) {
        iniciarAudio();
      }
    }


    function actualizarIconoSonido() {

      controlAudio.textContent =
        silenciado ? "🔇" : "🔊";

      controlAudio.title =
        silenciado
          ? "Activar sonido"
          : "Silenciar sonido";
    }


    /* ---------- INICIAR VOICE THEME ---------- */

    function iniciarAudio() {

      if (!audioEpilogo.paused) {
        return;
      }

      fadeIn(
        audioEpilogo,
        volumenEpilogo,
        2000
      );
    }


    /*
      Intentamos iniciar Voice Theme
      desde que carga el Epílogo.
    */

    window.addEventListener(
      "load",
      iniciarAudio
    );


    /*
      Si el navegador bloquea autoplay,
      la primera interacción activa la música.
    */

    document.addEventListener(
      "pointerdown",
      () => {

        if (audioEpilogo.paused) {
          iniciarAudio();
        }

      },
      { once: true }
    );


    document.addEventListener(
      "keydown",
      () => {

        if (audioEpilogo.paused) {
          iniciarAudio();
        }

      },
      { once: true }
    );


    /* ---------- SALIR DEL EPÍLOGO ---------- */

    document
      .querySelectorAll(".enlace-salida")
      .forEach(enlace => {

        enlace.addEventListener(
          "click",
          function(evento) {

            if (
              evento.ctrlKey ||
              evento.metaKey ||
              evento.shiftKey ||
              evento.button === 1
            ) {
              return;
            }

            evento.preventDefault();

            const destino = this.href;

            fadeOut(
              audioEpilogo,
              650
            );

            setTimeout(() => {

              window.location.href =
                destino;

            }, 650);
          }
        );
      });

  </script>

</body>
</html>
