<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Un ciclo más — Donde florece la soledad</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #020203;
      color: #f4f1ec;
      font-family: Georgia, "Times New Roman", serif;
      overflow: hidden;
    }

    /* ==================================================
       ESCENA GENERAL
    ================================================== */

    .escena {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 650px;
      overflow: hidden;
      isolation: isolate;

      background:
        radial-gradient(
          ellipse at 50% 86%,
          rgba(155, 5, 35, 0.55) 0%,
          rgba(105, 5, 25, 0.32) 24%,
          rgba(45, 2, 12, 0.18) 46%,
          transparent 70%
        ),
        linear-gradient(
          to bottom,
          #020203 0%,
          #050204 38%,
          #110207 65%,
          #33020d 100%
        );
    }

    /* ==================================================
       FONDO DIFUMINADO NEGRO → ROJO
    ================================================== */

    .fondo-rojo {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .fondo-rojo::before {
      content: "";
      position: absolute;

      width: 120%;
      height: 70%;

      left: -10%;
      bottom: -28%;

      background:
        radial-gradient(
          ellipse at center,
          rgba(210, 15, 48, 0.52) 0%,
          rgba(130, 4, 28, 0.32) 28%,
          rgba(70, 0, 18, 0.16) 52%,
          transparent 76%
        );

      filter: blur(48px);
    }

    .fondo-rojo::after {
      content: "";
      position: absolute;

      width: 80%;
      height: 55%;

      left: 10%;
      bottom: -22%;

      background:
        radial-gradient(
          ellipse at center,
          rgba(255, 30, 65, 0.18),
          rgba(120, 0, 20, 0.10) 42%,
          transparent 72%
        );

      filter: blur(75px);
    }

    .viñeta {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;

      background:
        radial-gradient(
          ellipse at center,
          transparent 35%,
          rgba(0,0,0,0.18) 66%,
          rgba(0,0,0,0.78) 100%
        );
    }

    /* ==================================================
       ENCABEZADO
    ================================================== */

    .encabezado {
      position: absolute;

      top: 26px;
      left: 50%;

      transform: translateX(-50%);

      width: calc(100% - 160px);

      z-index: 30;

      text-align: center;

      pointer-events: none;
    }

    .obra {
      color: #b89ca1;

      font-size: 0.64rem;

      letter-spacing: 0.52em;

      text-transform: uppercase;

      margin-bottom: 12px;
    }

    .titulo {
      font-size: clamp(2rem, 5vw, 4.5rem);

      font-weight: 400;

      letter-spacing: 0.24em;

      text-transform: uppercase;

      color: #f0e8e8;

      text-shadow:
        0 0 18px rgba(205, 45, 70, 0.13);
    }

    .subtitulo {
      margin-top: 10px;

      color: #947a7f;

      font-size: 0.62rem;

      letter-spacing: 0.48em;

      text-transform: uppercase;
    }

    /* ==================================================
       LETRA
    ================================================== */

    .zona-letra {
      position: absolute;

      top: 23%;
      left: 50%;

      transform: translateX(-50%);

      width: min(880px, 84vw);
      height: 31vh;

      z-index: 25;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;

      pointer-events: none;
    }

    .letra {
      opacity: 0;

      transform: translateY(10px);

      font-size: clamp(1.15rem, 2.15vw, 2rem);

      line-height: 1.65;

      letter-spacing: 0.055em;

      color: rgba(244, 241, 236, 0.95);

      font-style: italic;

      text-shadow:
        0 2px 12px rgba(0,0,0,1),
        0 0 20px rgba(175,20,45,0.20);

      transition:
        opacity 0.75s ease,
        transform 0.75s ease;
    }

    .letra.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .letra.coro {
      color: #f5dce0;

      text-shadow:
        0 2px 14px rgba(0,0,0,1),
        0 0 26px rgba(220,45,75,0.30);
    }

    .palabra-principal {
      display: block;

      margin-bottom: 3px;

      color: #de8793;

      font-size: 1.18em;

      letter-spacing: 0.11em;

      font-style: normal;
    }

    /* ==================================================
       PERSONAJES
    ================================================== */

    .personajes-contenedor {
      position: absolute;

      left: 50%;
      bottom: -3px;

      transform: translateX(-50%);

      width: min(78vw, 940px);

      height: 56vh;

      z-index: 10;

      display: flex;

      justify-content: center;
      align-items: flex-end;

      pointer-events: none;
    }

    .personajes {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;
      object-position: center bottom;

      filter:
        drop-shadow(0 -8px 24px rgba(0,0,0,0.55))
        drop-shadow(0 0 32px rgba(145,10,35,0.18));
    }

    /* ==================================================
       PÉTALOS
    ================================================== */

    .petalos {
      position: absolute;
      inset: 0;

      z-index: 20;

      overflow: hidden;

      pointer-events: none;
    }

    .petalo {
      position: absolute;

      top: -12vh;
      left: var(--x);

      width: var(--tam);
      height: calc(var(--tam) * 0.68);

      opacity: var(--opacidad);

      border-radius:
        75% 24% 72% 28%;

      background:
        radial-gradient(
          ellipse at 35% 35%,
          #ef6478 0%,
          #bd1737 42%,
          #570718 100%
        );

      filter: blur(var(--blur));

      animation:
        caer var(--duracion) linear infinite;

      animation-delay:
        var(--delay);

      transform-origin: center;
    }

    @keyframes caer {

      0% {
        transform:
          translate3d(0, -10vh, 0)
          rotate(0deg);

        opacity: 0;
      }

      10% {
        opacity: var(--opacidad);
      }

      45% {
        transform:
          translate3d(
            var(--deriva),
            48vh,
            0
          )
          rotate(190deg);
      }

      100% {
        transform:
          translate3d(
            calc(var(--deriva) * -0.45),
            116vh,
            0
          )
          rotate(430deg);

        opacity: 0;
      }
    }

    /* ==================================================
       BOTÓN INICIAL
    ================================================== */

    .inicio {
      position: absolute;

      left: 50%;
      top: 56%;

      transform: translate(-50%, -50%);

      z-index: 50;

      text-align: center;

      transition:
        opacity 0.6s ease,
        visibility 0.6s ease;
    }

    .inicio.oculto {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .boton-inicio {
      padding: 15px 27px;

      border:
        1px solid rgba(220,110,125,0.42);

      background:
        rgba(6,3,5,0.68);

      color: #edced3;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 0.72rem;

      letter-spacing: 0.22em;

      text-transform: uppercase;

      cursor: pointer;

      backdrop-filter: blur(10px);

      transition: 0.35s;
    }

    .boton-inicio:hover {
      color: white;

      border-color: #d76c78;

      background:
        rgba(130,12,32,0.16);
    }

    .inicio p {
      margin-top: 12px;

      color: #76686b;

      font-size: 0.69rem;

      font-style: italic;

      letter-spacing: 0.08em;
    }

    /* ==================================================
       REPRODUCTOR SOBRE LOS PERSONAJES
    ================================================== */

    .reproductor {
      position: absolute;

      left: 50%;
      bottom: 56px;

      transform: translateX(-50%);

      z-index: 40;

      width: min(560px, 46vw);

      display: flex;

      align-items: center;

      gap: 11px;

      padding: 9px 12px;

      background:
        rgba(4,3,5,0.54);

      border:
        1px solid rgba(255,255,255,0.10);

      border-radius: 28px;

      backdrop-filter:
        blur(12px);

      box-shadow:
        0 8px 30px rgba(0,0,0,0.30);
    }

    .boton-audio {
      flex: 0 0 auto;

      width: 36px;
      height: 36px;

      border-radius: 50%;

      border:
        1px solid rgba(255,255,255,0.18);

      background:
        rgba(255,255,255,0.025);

      color: #f0e9e7;

      cursor: pointer;

      font-size: 0.85rem;

      transition: 0.3s;
    }

    .boton-audio:hover {
      border-color: #d76c78;
      color: white;
    }

    /* ==================================================
       BARRA DE PROGRESO
    ================================================== */

    .barra-contenedor {
      flex: 1;

      display: flex;

      align-items: center;

      min-width: 0;
    }

    .barra {
      appearance: none;
      -webkit-appearance: none;

      width: 100%;
      height: 4px;

      border-radius: 4px;

      outline: none;

      cursor: pointer;

      background:
        linear-gradient(
          to right,
          #d76c78 0%,
          #d76c78 var(--progreso, 0%),
          rgba(255,255,255,0.18) var(--progreso, 0%),
          rgba(255,255,255,0.18) 100%
        );
    }

    .barra::-webkit-slider-thumb {
      -webkit-appearance: none;

      width: 12px;
      height: 12px;

      border-radius: 50%;

      background: #efc7cd;

      border:
        2px solid #8f3443;

      cursor: pointer;

      box-shadow:
        0 0 7px rgba(215,108,120,0.52);
    }

    .barra::-moz-range-thumb {
      width: 12px;
      height: 12px;

      border-radius: 50%;

      background: #efc7cd;

      border:
        2px solid #8f3443;

      cursor: pointer;
    }

    .tiempo {
      flex: 0 0 auto;

      min-width: 78px;

      font-family:
        Arial,
        sans-serif;

      font-size: 0.62rem;

      letter-spacing: 0.04em;

      color: #aa999c;

      text-align: center;
    }

    /* ==================================================
       NAVEGACIÓN
    ================================================== */

    .navegacion {
      position: absolute;

      left: 22px;
      bottom: 20px;

      z-index: 45;

      display: flex;

      gap: 8px;

      flex-wrap: wrap;
    }

    .boton-nav {
      color: #a99da0;

      text-decoration: none;

      text-transform: uppercase;

      font-size: 0.59rem;

      letter-spacing: 0.16em;

      padding: 11px 14px;

      border:
        1px solid rgba(255,255,255,0.10);

      background:
        rgba(4,3,5,0.52);

      backdrop-filter:
        blur(8px);

      transition: 0.3s;
    }

    .boton-nav:hover {
      color: white;

      border-color: #d76c78;

      background:
        rgba(179,55,75,0.10);
    }

    /* ==================================================
       MOBILE
    ================================================== */

    @media (max-width: 700px) {

      .escena {
        min-height: 620px;
      }

      .encabezado {
        top: 21px;

        width: 92%;
      }

      .obra {
        font-size: 0.49rem;

        letter-spacing: 0.35em;
      }

      .titulo {
        font-size:
          clamp(
            1.55rem,
            8vw,
            2.4rem
          );

        letter-spacing: 0.15em;
      }

      .subtitulo {
        font-size: 0.47rem;

        letter-spacing: 0.30em;
      }

      .zona-letra {
        top: 18%;

        width: 90vw;
        height: 33vh;
      }

      .letra {
        font-size:
          clamp(
            0.96rem,
            4.5vw,
            1.32rem
          );

        line-height: 1.52;
      }

      .personajes-contenedor {
        width: 115vw;

        height: 48vh;

        bottom: 0;
      }

      .reproductor {
        bottom: 72px;

        width: 82vw;

        padding: 7px 9px;

        gap: 7px;
      }

      .boton-audio {
        width: 32px;
        height: 32px;

        font-size: 0.75rem;
      }

      .tiempo {
        min-width: 66px;

        font-size: 0.53rem;
      }

      .navegacion {
        left: 50%;
        bottom: 14px;

        transform:
          translateX(-50%);

        width: 92%;

        justify-content: center;
      }

      .boton-nav {
        font-size: 0.49rem;

        padding: 9px 10px;

        text-align: center;
      }

      .inicio {
        top: 53%;
      }

      .boton-inicio {
        font-size: 0.65rem;

        padding: 13px 20px;
      }
    }

    @media (max-height: 700px) {

      .zona-letra {
        top: 18%;
        height: 28vh;
      }

      .personajes-contenedor {
        height: 49vh;
      }

      .titulo {
        font-size: 2rem;
      }

      .reproductor {
        bottom: 46px;
      }
    }

  </style>
</head>


<body>

  <section class="escena">

    <!-- FONDO -->

    <div class="fondo-rojo"></div>
    <div class="viñeta"></div>


    <!-- PÉTALOS -->

    <div
      class="petalos"
      id="petalos">
    </div>


    <!-- ENCABEZADO -->

    <header class="encabezado">

      <div class="obra">
        Donde florece la soledad
      </div>

      <h1 class="titulo">
        Un ciclo más
      </h1>

      <div class="subtitulo">
        Canción original
      </div>

    </header>


    <!-- LETRA -->

    <div class="zona-letra">

      <div
        class="letra"
        id="letra">
      </div>

    </div>


    <!-- GÉ Y BE -->

    <div class="personajes-contenedor">

      <img
        class="personajes"
        src="Ge-Be.png"
        alt="Gé y Be">

    </div>


    <!-- BOTÓN DE INICIO -->

    <div
      class="inicio"
      id="inicio">

      <button
        class="boton-inicio"
        onclick="comenzar()">

        Escuchar

      </button>

      <p>
        Una última canción para el camino.
      </p>

    </div>


    <!-- REPRODUCTOR -->

    <div class="reproductor">

      <button
        class="boton-audio"
        id="play"
        onclick="alternarPlay()"
        aria-label="Reproducir o pausar">

        ▶

      </button>


      <div class="barra-contenedor">

        <input
          type="range"
          class="barra"
          id="barra"
          min="0"
          max="100"
          value="0"
          step="0.1"
          aria-label="Posición de la canción">

      </div>


      <div
        class="tiempo"
        id="tiempo">

        0:00 / 3:33

      </div>


      <button
        class="boton-audio"
        id="mute"
        onclick="alternarMute()"
        aria-label="Activar o silenciar sonido">

        🔊

      </button>

    </div>


    <!-- NAVEGACIÓN -->

    <nav class="navegacion">

      <a
        class="boton-nav"
        href="../novela/">

        ← Novela

      </a>

      <a
        class="boton-nav"
        href="../">

        Menú

      </a>

    </nav>


    <!-- AUDIO -->

    <audio
      id="audio"
      src="../Audios/Un%20ciclo%20mas.mp3"
      preload="auto">
    </audio>

  </section>


  <script>

    /* ==================================================
       ELEMENTOS
    ================================================== */

    const audio =
      document.getElementById("audio");

    const letra =
      document.getElementById("letra");

    const botonPlay =
      document.getElementById("play");

    const botonMute =
      document.getElementById("mute");

    const inicio =
      document.getElementById("inicio");

    const tiempo =
      document.getElementById("tiempo");

    const barra =
      document.getElementById("barra");


    const volumenNormal = 0.27;

    audio.volume =
      volumenNormal;


    let silenciado =
      localStorage.getItem(
        "sonidoSilenciado"
      ) === "true";


    audio.muted =
      silenciado;


    actualizarMute();


    /* ==================================================
       LETRA SINCRONIZADA
    ================================================== */

    const bloques = [

      /* ESTROFA 1
         0:30 — 0:42
      */

      {
        inicio: 30,
        fin: 42,

        tipo: "verso",

        html:
          '<span class="palabra-principal">Caminos</span>' +
          'Que parecen avanzar,<br>' +
          'Te hacen regresar<br>' +
          'Al mismo lugar.'
      },


      /* ESTROFA 2
         0:44.5 — 0:57
      */

      {
        inicio: 44.5,
        fin: 57,

        tipo: "verso",

        html:
          '<span class="palabra-principal">Sombras</span>' +
          'Sin rostros que mostrar<br>' +
          'con gran peso detrás<br>' +
          'Te envuelven y se van.'
      },


      /* PRE CORO
         0:58 — 1:11
      */

      {
        inicio: 58,
        fin: 71,

        tipo: "pre",

        html:
          'Y aunque vuelva a caminar,<br>' +
          'Algo en mí no vuelve igual.'
      },


      /* CORO PARTE 1
         1:11.5 — 1:25
      */

      {
        inicio: 71.5,
        fin: 85,

        tipo: "coro",

        html:
          'Pero al repetir un ciclo más<br>' +
          'Sientes que todo es oscuridad en ti<br>' +
          'No es así...'
      },


      /* CORO PARTE 2
         1:25.5 — 1:41
      */

      {
        inicio: 85.5,
        fin: 101,

        tipo: "coro",

        html:
          'Otra realidad se mostrará<br>' +
          'Si logras mirar más allá de ti<br>' +
          'Y dentro de ti'
      },


      /* ESTROFA 3
         1:54 — 2:07
      */

      {
        inicio: 114,
        fin: 127,

        tipo: "verso",

        html:
          '<span class="palabra-principal">Flores</span>' +
          'nacen al pasar<br>' +
          'algunas quedarán,<br>' +
          'y otras morirán.'
      },


      /* ESTROFA 4
         2:08 — 2:21
      */

      {
        inicio: 128,
        fin: 141,

        tipo: "verso",

        html:
          '<span class="palabra-principal">Huellas</span>' +
          'Vuelven hacia atrás,<br>' +
          'Parecen terminar<br>' +
          'y vuelven a empezar.'
      },


      /* PRE CORO 2
         2:22 — 2:35
      */

      {
        inicio: 142,
        fin: 155,

        tipo: "pre",

        html:
          'Y aunque vuelva a caminar,<br>' +
          'Algo en mí no vuelve igual.'
      },


      /* CORO FINAL PARTE 1
         2:35.5 — 2:48
      */

      {
        inicio: 155.5,
        fin: 168,

        tipo: "coro",

        html:
          'Pero al repetir un ciclo más<br>' +
          'Sientes que todo es oscuridad en ti<br>' +
          'No es así...'
      },


      /* CORO FINAL PARTE 2
         2:49 — 3:04
      */

      {
        inicio: 169,
        fin: 184,

        tipo: "coro",

        html:
          'Otra realidad se mostrará<br>' +
          'Si logras mirar más allá de ti<br>' +
          'Y dentro de ti'
      }

    ];


    let bloqueActual = -1;


    /* ==================================================
       COMENZAR
    ================================================== */

    function comenzar() {

      inicio.classList.add(
        "oculto"
      );

      audio.currentTime = 0;

      audio.play()
        .then(() => {

          botonPlay.textContent =
            "❚❚";

        })
        .catch(() => {

          botonPlay.textContent =
            "▶";

        });
    }


    /* ==================================================
       PLAY / PAUSA
    ================================================== */

    function alternarPlay() {

      inicio.classList.add(
        "oculto"
      );

      if (audio.paused) {

        audio.play();

      } else {

        audio.pause();

      }
    }


    audio.addEventListener(
      "play",
      () => {

        botonPlay.textContent =
          "❚❚";
      }
    );


    audio.addEventListener(
      "pause",
      () => {

        botonPlay.textContent =
          "▶";
      }
    );


    /* ==================================================
       MUTE
    ================================================== */

    function alternarMute() {

      silenciado =
        !silenciado;

      audio.muted =
        silenciado;

      localStorage.setItem(
        "sonidoSilenciado",
        silenciado
      );

      actualizarMute();
    }


    function actualizarMute() {

      botonMute.textContent =
        silenciado
          ? "🔇"
          : "🔊";
    }


    /* ==================================================
       LETRA
    ================================================== */

    function actualizarLetra() {

      const segundo =
        audio.currentTime;

      let encontrado =
        -1;


      for (
        let i = 0;
        i < bloques.length;
        i++
      ) {

        if (
          segundo >= bloques[i].inicio &&
          segundo < bloques[i].fin
        ) {

          encontrado = i;

          break;
        }
      }


      if (
        encontrado === bloqueActual
      ) {

        return;
      }


      letra.classList.remove(
        "visible"
      );


      bloqueActual =
        encontrado;


      setTimeout(() => {

        /*
          Comprobamos otra vez para evitar
          que una transición atrasada muestre
          una estrofa equivocada al mover
          manualmente la barra.
        */

        if (
          bloqueActual !== encontrado
        ) {

          return;
        }


        if (
          encontrado === -1
        ) {

          letra.innerHTML = "";

          letra.className =
            "letra";

          return;
        }


        const bloque =
          bloques[encontrado];


        letra.innerHTML =
          bloque.html;


        letra.className =
          "letra";


        if (
          bloque.tipo === "coro"
        ) {

          letra.classList.add(
            "coro"
          );
        }


        requestAnimationFrame(
          () => {

            letra.classList.add(
              "visible"
            );
          }
        );

      }, 220);
    }


    audio.addEventListener(
      "timeupdate",
      actualizarLetra
    );


    /* ==================================================
       FORMATO DE TIEMPO
    ================================================== */

    function formatoTiempo(
      segundos
    ) {

      if (
        !Number.isFinite(segundos)
      ) {

        return "0:00";
      }


      const minutos =
        Math.floor(
          segundos / 60
        );


      const segundosRestantes =
        Math.floor(
          segundos % 60
        );


      return (
        minutos +
        ":" +
        segundosRestantes
          .toString()
          .padStart(2, "0")
      );
    }


    /* ==================================================
       ACTUALIZAR BARRA
    ================================================== */

    function actualizarBarra() {

      if (
        !Number.isFinite(
          audio.duration
        ) ||
        audio.duration <= 0
      ) {

        return;
      }


      const porcentaje =
        (
          audio.currentTime /
          audio.duration
        ) * 100;


      barra.value =
        porcentaje;


      barra.style.setProperty(
        "--progreso",
        porcentaje + "%"
      );


      tiempo.textContent =
        formatoTiempo(
          audio.currentTime
        ) +
        " / " +
        formatoTiempo(
          audio.duration
        );
    }


    audio.addEventListener(
      "timeupdate",
      actualizarBarra
    );


    audio.addEventListener(
      "loadedmetadata",
      () => {

        actualizarBarra();
      }
    );


    /* ==================================================
       ADELANTAR / ATRASAR
    ================================================== */

    barra.addEventListener(
      "input",
      () => {

        if (
          !Number.isFinite(
            audio.duration
          )
        ) {

          return;
        }


        const nuevoTiempo =
          (
            barra.value / 100
          ) *
          audio.duration;


        audio.currentTime =
          nuevoTiempo;


        bloqueActual = -2;

        actualizarLetra();

        actualizarBarra();

        inicio.classList.add(
          "oculto"
        );
      }
    );


    /* ==================================================
       FINAL
    ================================================== */

    audio.addEventListener(
      "ended",
      () => {

        botonPlay.textContent =
          "▶";


        letra.classList.remove(
          "visible"
        );


        setTimeout(() => {

          letra.innerHTML =
            "";

          letra.className =
            "letra";

        }, 600);
      }
    );


    /* ==================================================
       PÉTALOS
    ================================================== */

    const contenedorPetalos =
      document.getElementById(
        "petalos"
      );


    function crearPetalos() {

      const cantidad =
        window.innerWidth < 700
          ? 20
          : 34;


      for (
        let i = 0;
        i < cantidad;
        i++
      ) {

        const petalo =
          document.createElement(
            "span"
          );


        petalo.className =
          "petalo";


        const tam =
          8 +
          Math.random() * 23;


        const x =
          Math.random() * 100;


        const duracion =
          9 +
          Math.random() * 13;


        const delay =
          Math.random() * -20;


        const deriva =
          -100 +
          Math.random() * 200;


        const opacidad =
          0.24 +
          Math.random() * 0.68;


        const blur =
          Math.random() < 0.22
            ? 2.8
            : 0;


        petalo.style.setProperty(
          "--tam",
          tam + "px"
        );


        petalo.style.setProperty(
          "--x",
          x + "%"
        );


        petalo.style.setProperty(
          "--duracion",
          duracion + "s"
        );


        petalo.style.setProperty(
          "--delay",
          delay + "s"
        );


        petalo.style.setProperty(
          "--deriva",
          deriva + "px"
        );


        petalo.style.setProperty(
          "--opacidad",
          opacidad
        );


        petalo.style.setProperty(
          "--blur",
          blur + "px"
        );


        contenedorPetalos.appendChild(
          petalo
        );
      }
    }


    crearPetalos();


    /* ==================================================
       ESPACIO = PLAY / PAUSA
    ================================================== */

    document.addEventListener(
      "keydown",
      evento => {

        if (
          evento.code === "Space"
        ) {

          evento.preventDefault();

          alternarPlay();
        }
      }
    );

  </script>

</body>
